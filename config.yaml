crawler:
  concurrency: 10
  delay: 0.05
  timeout: 15.0
  max_retries: 3
  backoff_factor: 1.5
  user_agent: "SEOJEV-Bot/1.0 (+https://seojev.ai/bot; universal seo engine)"
  verify_ssl: true
  max_pages: 5000
  follow_redirects: true
  max_redirects: 10

robots:
  respect_robots: true
  user_agent_token: "SEOJEV-Bot"

sitemap:
  auto_discover: true
  timeout: 15.0

render:
  enabled: false
  selective: true
  empty_threshold_words: 30
  wait_timeout: 12000
  max_browser_contexts: 3

performance:
  sample_size: 100
  timeout_ms: 15000

laya:
  enabled: true
  model_id: "aac6fef/laya-mlx"
  batch_size: 16
  # Measured on 200 real candidates; see docs/LAYA_CONFIDENCE.md.
  confidence:
    verdict_min: 0.60
    action_min: 0.50
    auto_accept_min: 0.90
  max_error_rate: 0.0
  max_recent_errors: 20
  queue_timeout_seconds: 1800

storage:
  db_path: "data/seo.db"

reports:
  output_dir: "reports/"

# --profile dev is the default; prod must be explicitly selected.
profiles:
  dev:
    max_urls: 500
    seed: 42
    memory_budget_mb: 4096
    max_workers: 2
    batch_size: 8
    queue_size: 16
    throttle_seconds: 0.05
    pause_seconds: 2.0
    min_available_mb: 1536
  prod:
    max_urls: 5000000
    memory_budget_mb: 32768
    max_workers: 8
    batch_size: 32
    queue_size: 64
    throttle_seconds: 0.0
